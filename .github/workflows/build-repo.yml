name: Update APT Repository

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils curl jq

      - name: Prepare APT Directory Structure
        run: |
          mkdir -p public/packages
          mkdir -p public/dists/stable/main/binary-arm64

      - name: Fetch Kernel Debs from Kernel Repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd public/packages
          echo "=== 1. 拉取内核 Deb 包 ==="
          KERNEL_RUN_ID=$(gh run list --repo OpenMoTa3/kernel-fairphone-sm7225 --workflow "build-droidian-kernel.yml" --limit 1 --json databaseId -q '.[0].databaseId' || true)
          if [ -n "$KERNEL_RUN_ID" ] && [ "$KERNEL_RUN_ID" != "null" ]; then
            gh run download "$KERNEL_RUN_ID" --repo OpenMoTa3/kernel-fairphone-sm7225 --dir . || true
          fi
          cd ../..

      - name: Fetch Adaptation Debs from Droidian Repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd public/packages
          echo "=== 2. 拉取 Droidian 适配 Deb 包 ==="
          DROIDIAN_RUN_ID=$(gh run list --repo OpenMoTa3/droidian --limit 1 --json databaseId -q '.[0].databaseId' || true)
          if [ -n "$DROIDIAN_RUN_ID" ] && [ "$DROIDIAN_RUN_ID" != "null" ]; then
            gh run download "$DROIDIAN_RUN_ID" --repo OpenMoTa3/droidian --name droidian-fp4-adaptation-debs --dir . || true
          fi
          cd ../..

      - name: Generate Official APT Indexes
        run: |
          cd public/packages
          # 扁平化
          find . -mindepth 2 -type f -name "*.deb" -exec mv -v {} . \;
          find . -mindepth 1 -type d -empty -delete
          cd ../..

          echo "=== 当前 packages/ 下的全部实体 Deb ==="
          ls -lh public/packages/

          echo ">>> 正在按官方规范生成 Packages 索引..."
          cd public
          dpkg-scanpackages --arch arm64 packages > dists/stable/main/binary-arm64/Packages
          gzip -k -f dists/stable/main/binary-arm64/Packages

          echo ">>> 正在按官方规范生成 Release 元数据..."
          cd dists/stable
          printf "Origin: https://openmota3.github.io/droidian-repo\nLabel: Droidian PKG\nSuite: stable\nCodename: stable\nVersion: 1.0\nArchitectures: arm64\nComponents: main\nDescription: Fairphone 4 Droidian Packages\n" > Release
          apt-ftparchive release . >> Release
          cd ../../..

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
