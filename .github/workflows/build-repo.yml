name: Update APT Repository

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils curl jq

      - name: Prepare APT Directory Structure
        run: |
          mkdir -p site/pool/main
          mkdir -p site/dists/bookworm/main/binary-arm64

      - name: Fetch Kernel Debs from Kernel Repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site/pool/main
          echo "=== 1. 正在拉取内核 Deb 包 ==="
          KERNEL_RUN_ID=$(gh run list --repo OpenMoTa3/kernel-fairphone-sm7225 --workflow "build-droidian-kernel.yml" --status success --limit 1 --json databaseId -q '.[0].databaseId' || true)
          if [ -n "$KERNEL_RUN_ID" ] && [ "$KERNEL_RUN_ID" != "null" ]; then
            echo ">>> 命中内核 Run ID: $KERNEL_RUN_ID"
            gh run download "$KERNEL_RUN_ID" --repo OpenMoTa3/kernel-fairphone-sm7225 --dir . || true
          else
            echo "Warning: 未找到内核构建 Artifact，尝试从 Release 获取..."
            gh release download --repo OpenMoTa3/kernel-fairphone-sm7225 --pattern "*.deb" --dir . 2>/dev/null || true
          fi
          cd ../../..

      - name: Fetch Adaptation Debs from Droidian Repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site/pool/main
          echo "=== 2. 正在拉取 Droidian 仓库生成的适配包 ==="
          DROIDIAN_RUN_ID=$(gh run list --repo OpenMoTa3/droidian --status success --limit 1 --json databaseId -q '.[0].databaseId' || true)
          if [ -n "$DROIDIAN_RUN_ID" ] && [ "$DROIDIAN_RUN_ID" != "null" ]; then
            echo ">>> 命中 Droidian Run ID: $DROIDIAN_RUN_ID"
            gh run download "$DROIDIAN_RUN_ID" --repo OpenMoTa3/droidian --name droidian-fp4-adaptation-debs --dir . || true
          fi
          cd ../../..

      - name: Generate APT Indexes & Release
        run: |
          cd site
          echo "=== 3. 当前 pool/main/ 中的全部 Deb 清单 ==="
          ls -lh pool/main/

          # 检查是否有 deb 文件，没有则报警
          DEB_COUNT=$(ls -1 pool/main/*.deb 2>/dev/null | wc -l)
          if [ "$DEB_COUNT" -eq 0 ]; then
            echo "Error: pool/main/ 下没有任何 .deb 包，请先确保内核与适配包构建成功！"
            exit 1
          fi

          echo ">>> 正在生成 Packages 和 Packages.gz 索引..."
          dpkg-scanpackages --arch arm64 pool/main > dists/bookworm/main/binary-arm64/Packages
          gzip -9c dists/bookworm/main/binary-arm64/Packages > dists/bookworm/main/binary-arm64/Packages.gz

          echo ">>> 正在生成 Release 元数据..."
          cd dists/bookworm
          printf "APT::FTPArchive::Release::Origin \"OpenMoTa3\";\nAPT::FTPArchive::Release::Label \"Droidian-FP4-Repo\";\nAPT::FTPArchive::Release::Suite \"bookworm\";\nAPT::FTPArchive::Release::Codename \"bookworm\";\nAPT::FTPArchive::Release::Architectures \"arm64\";\nAPT::FTPArchive::Release::Components \"main\";\nAPT::FTPArchive::Release::Description \"APT Repository for Fairphone 4 Droidian\";\n" > apt-release.conf
          apt-ftparchive -c apt-release.conf release . > Release
          rm -f apt-release.conf
          cd ../..

          echo "=== 4. 最终生成的 Packages 索引内容预览 ==="
          head -n 30 dists/bookworm/main/binary-arm64/Packages

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
