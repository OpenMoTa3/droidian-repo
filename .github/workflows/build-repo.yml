name: Update APT Repository

on:
  workflow_dispatch:
    inputs:
      kernel_run_id:
        description: "Kernel Actions Run ID (Optional, leave empty for latest)"
        required: false
        default: ""
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils curl jq

      - name: Prepare APT Directory Structure
        run: |
          mkdir -p site/pool/main
          mkdir -p site/dists/bookworm/main/binary-arm64

      - name: Download Kernel Debs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site/pool/main
          echo "=== 正在获取内核构建产物 ==="
          RUN_ID="${{ github.event.inputs.kernel_run_id }}"
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --repo OpenMoTa3/kernel-fairphone-sm7225 --workflow "build-droidian-kernel.yml" --status success --limit 1 --json databaseId -q '.[0].databaseId' || true)
          fi
          if [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ]; then
            echo ">>> 找到内核构建 Run ID: $RUN_ID，正在下载产物..."
            gh run download "$RUN_ID" --repo OpenMoTa3/kernel-fairphone-sm7225 --dir . || true
          else
            echo ">>> 未找到内核 Run ID，尝试从 Releases 下载..."
            gh release download --repo OpenMoTa3/kernel-fairphone-sm7225 --pattern "*.deb" --dir . 2>/dev/null || true
          fi
          cd ../../..

      - name: Build Adaptation Debs
        run: |
          git clone --depth 1 https://gitlab.com/ubports/porting/reference-device-ports/android11/fairphone-4/fairphone-fp4.git /tmp/fp4-ut
          
          mkdir -p /tmp/adapt/DEBIAN /tmp/adapt/etc/udev/rules.d
          if [ -d "/tmp/fp4-ut/overlay/system/etc/udev/rules.d" ]; then
            cp -r /tmp/fp4-ut/overlay/system/etc/udev/rules.d/* /tmp/adapt/etc/udev/rules.d/
          fi
          printf "Package: adaptation-fairphone-fp4\nVersion: 1.0.0\nSection: misc\nPriority: optional\nArchitecture: arm64\nMaintainer: OpenMoTa3 <noreply@github.com>\nDepends: udev, adaptation-fairphone-fp4-configs\nDescription: Device adaptation for FP4 on Droidian\n" > /tmp/adapt/DEBIAN/control
          dpkg-deb --build --root-owner-group /tmp/adapt site/pool/main/adaptation-fairphone-fp4_1.0.0_arm64.deb

          mkdir -p /tmp/adapt-cfg/DEBIAN
          printf "Package: adaptation-fairphone-fp4-configs\nVersion: 1.0.0\nSection: misc\nPriority: optional\nArchitecture: arm64\nMaintainer: OpenMoTa3 <noreply@github.com>\nDescription: Device adaptation configs for FP4\n" > /tmp/adapt-cfg/DEBIAN/control
          dpkg-deb --build --root-owner-group /tmp/adapt-cfg site/pool/main/adaptation-fairphone-fp4-configs_1.0.0_arm64.deb

      - name: Generate APT Indexes & Hashes
        run: |
          cd site
          dpkg-scanpackages --arch arm64 pool/main > dists/bookworm/main/binary-arm64/Packages
          gzip -9c dists/bookworm/main/binary-arm64/Packages > dists/bookworm/main/binary-arm64/Packages.gz

          cd dists/bookworm
          printf "APT::FTPArchive::Release::Origin \"OpenMoTa3\";\nAPT::FTPArchive::Release::Label \"Droidian-FP4-Repo\";\nAPT::FTPArchive::Release::Suite \"bookworm\";\nAPT::FTPArchive::Release::Codename \"bookworm\";\nAPT::FTPArchive::Release::Architectures \"arm64\";\nAPT::FTPArchive::Release::Components \"main\";\nAPT::FTPArchive::Release::Description \"APT Repository for Fairphone 4 Droidian\";\n" > apt-release.conf
          apt-ftparchive -c apt-release.conf release . > Release
          rm -f apt-release.conf
          cd ../..

          echo "=== 部署站点全部文件清单 ==="
          find . -type f

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
